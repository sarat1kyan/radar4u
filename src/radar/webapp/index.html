<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RADAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <link rel="stylesheet" href="/app/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">RADAR</div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="search" id="tab-search">Search</button>
      <button class="tab" data-tab="radars" id="tab-radars">Radars</button>
      <button class="tab" data-tab="settings" id="tab-settings">Settings</button>
    </nav>
  </header>

  <main>
    <section id="view-search" class="view">
      <form id="search-form" class="search" autocomplete="off">
        <textarea id="q" rows="2" maxlength="2000" placeholder="sushi for two in Yerevan tomorrow at 18:00"></textarea>
        <button type="submit" id="go">Search</button>
      </form>
      <div id="chips" class="chips"></div>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="summary" class="summary"></div>
      <div id="results"></div>
      <div id="footer" class="footer"></div>
    </section>

    <section id="view-radars" class="view hidden">
      <div id="radars"></div>
    </section>

    <section id="view-settings" class="view hidden">
      <label class="field"><span id="lbl-language">Language</span><select id="set-lang"></select></label>
      <label class="field"><span id="lbl-currency">Currency</span>
        <select id="set-cur">
          <option>EUR</option><option>USD</option><option>AMD</option><option>GEL</option><option>KZT</option>
          <option>GBP</option><option>CHF</option><option>PLN</option><option>CZK</option><option>RUB</option>
        </select>
      </label>
      <p class="muted" id="attrib">Map data (c) OpenStreetMap contributors. Timetables: Transitous (transitous.org/sources). Rates: ECB and "Rates By Exchange Rate API".</p>
    </section>
  </main>

  <template id="card">
    <article class="card">
      <div class="card-head">
        <h3 class="title"></h3>
        <span class="badge"></span>
      </div>
      <div class="sub"></div>
      <div class="line price"></div>
      <div class="line meta"></div>
      <div class="line met"></div>
      <div class="line unverified"></div>
      <div class="line unmet"></div>
      <div class="line why"></div>
      <div class="line source"></div>
      <div class="actions"></div>
    </article>
  </template>

  <script src="/app/static/app.js"></script>
</body>
</html>
