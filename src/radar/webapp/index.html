<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>RADAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="/app/static/styles.css">
</head>
<body>
  <div class="splash" id="splash">
    <div>
      <div class="radar"><span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span></div>
      <div class="word">RADAR</div>
    </div>
  </div>
  <div id="app">
    <!-- HOME -->
    <section class="view" id="v-home">
      <header class="hero">
        <span class="blob a"></span><span class="blob b"></span><span class="blob c"></span>
        <div class="hero-top">
          <div class="logo"><span class="pulse"></span>RADAR</div>
          <button class="pill" id="city-pill" type="button"></button>
        </div>
        <h1 id="t-tagline"></h1>
        <form id="quick" class="quick" autocomplete="off">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" maxlength="300" enterkeyhint="search" placeholder="sushi for two tomorrow 19:00">
        </form>
      </header>
      <div class="chips quick-row" id="quick-row"></div>
      <div class="section-title" id="t-categories"></div>
      <div class="grid" id="tiles"></div>
    </section>

    <!-- BUILDER -->
    <section class="view hidden" id="v-builder">
      <div class="page-head"><div class="eyebrow" id="b-eyebrow"></div><h2 id="b-title"></h2></div>
      <div id="b-steps"></div>
    </section>

    <!-- RESULTS -->
    <section class="view hidden" id="v-results">
      <div class="page-head"><div class="eyebrow" id="r-eyebrow"></div><h2 id="r-title"></h2>
        <div class="chips small" id="r-chips"></div></div>
      <div id="map" class="map hidden"></div>
      <div class="seg" id="r-sort"></div>
      <div id="r-list"></div>
      <div class="note" id="r-note"></div>
    </section>

    <!-- RADARS -->
    <section class="view hidden" id="v-radars">
      <div class="page-head"><div class="eyebrow">RADAR</div><h2 id="t-radars"></h2></div>
      <div id="radar-list"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view hidden" id="v-settings">
      <div class="page-head"><div class="eyebrow">RADAR</div><h2 id="t-settings"></h2></div>
      <div class="list">
        <label class="row"><span id="t-language"></span><select id="set-lang"></select></label>
        <label class="row"><span id="t-currency"></span>
          <select id="set-cur"><option>EUR</option><option>USD</option><option>AMD</option><option>GEL</option>
            <option>KZT</option><option>GBP</option><option>CHF</option><option>PLN</option><option>CZK</option>
            <option>RUB</option></select></label>
      </div>
      <p class="fine">Map data (c) OpenStreetMap contributors. Timetables: Transitous. Photos: Wikimedia Commons.
        Rates: ECB and "Rates By Exchange Rate API".</p>
    </section>
  </div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span id="tab-home"></span></button>
    <button data-tab="radars"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 6"/></svg><span id="tab-radars"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span id="tab-settings"></span></button>
  </nav>

  <div class="sheet-backdrop hidden" id="backdrop"></div>
  <aside class="sheet" id="sheet" aria-hidden="true"><div class="grab"></div><div id="sheet-body" class="sheet-body"></div></aside>

  <div class="toast hidden" id="toast"></div>
  <script src="/app/static/app.js"></script>
</body>
</html>
